name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. undoturn init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UndoTurn version
      description: Output of `undoturn --version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex CLI, Gemini CLI, Cursor CLI, Copilot CLI, Droid, Devin CLI, OpenCode, Pi, Oh My Pi, Other]
    validations:
      required: true
  - type: checkboxes
    id: dataloss
    attributes:
      label: Data loss
      options:
        - label: I lost file contents because of this bug.
