name: Feature request
description: Suggest a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you try to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should UndoTurn do?
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you handle this today?
