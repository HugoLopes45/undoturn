labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to do, and what did you try?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `undoturn doctor`
      description: Optional. Replace your user name and private paths before you paste.
      render: text
  - type: input
    id: setup
    attributes:
      label: UndoTurn version, agent and macOS version
      placeholder: 0.1.0, Claude Code 2.1.0, macOS 15.4
