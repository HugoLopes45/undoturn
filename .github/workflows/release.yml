name: Release

# A version tag builds, signs, notarizes and attests the artifacts, then opens a draft release.
# A maintainer publishes the draft by hand.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Draft release
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # create the draft release
      id-token: write # sign build provenance
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches main, the version and the changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*current = "\([^"]*\)".*/\1/p' Sources/UndoTurnCore/UndoTurnVersion.swift)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          sh scripts/changelog.sh check
          today=$(date -u +%F)
          grep -q "^## \[$version\] - $today\$" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section dated $today (UTC)"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Test
        run: swift test
      - name: Import the signing identity
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode >"$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode >"$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials undoturn-release \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          echo "UNDOTURN_SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "UNDOTURN_NOTARY_PROFILE=undoturn-release" >>"$GITHUB_ENV"
      - name: Build, sign and notarize
        run: sh scripts/release.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .build/release-artifacts/${{ steps.version.outputs.version }}/UndoTurn-*.dmg
            .build/release-artifacts/${{ steps.version.outputs.version }}/undoturn-*.tar.gz
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh scripts/changelog.sh notes "$VERSION" >"$RUNNER_TEMP/notes.md"
          dist=".build/release-artifacts/$VERSION"
          # Stable names keep the README links to releases/latest/download/ valid for every version.
          cp "$dist/UndoTurn-$VERSION.dmg" "$dist/UndoTurn.dmg"
          cp "$dist/undoturn-$VERSION-macos-universal.tar.gz" "$dist/undoturn-macos-universal.tar.gz"
          (cd "$dist" && shasum -a 256 UndoTurn.dmg undoturn-macos-universal.tar.gz >>SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "UndoTurn $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$dist"/UndoTurn*.dmg "$dist"/undoturn-*.tar.gz "$dist/SHA256SUMS"
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
